<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket LLM</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand">Pocket&nbsp;LLM</div>
  <button id="new-chat">＋ New chat</button>
  <div id="chats" class="chats"></div>

  <div class="docs">
    <div class="docs-head">
      <span id="docs-label">Documents</span>
      <button id="add-docs" title="Add text files to search">＋ Add</button>
    </div>
    <div id="doc-list" class="doc-list"></div>
    <label class="use-docs" title="Search your documents and give the model what it finds">
      <input type="checkbox" id="use-docs" disabled> Use in answers
    </label>
  </div>
  <input type="file" id="doc-input" multiple hidden
         accept=".txt,.md,.markdown,.mdx,.text,.rst,.org,.log,.csv,.tsv,.json,.yaml,.yml,
                 .pdf,.docx,.pptx,.xlsx,.rtf,.xml,.html,.htm,.xhtml,.css,
                 .zip,.tar,.gz,.tgz">

  <div class="meta">
    <div class="row model-row"><span>Model</span></div>
    <select id="model-select" title="Choose a model"><option>loading…</option></select>
    <div class="row"><span>Status</span><b id="status" class="off">offline</b></div>
    <div class="row"><span>Speed</span><b id="tps">—</b></div>
  </div>
  <button id="erase-all" class="erase" hidden>Erase all conversations</button>
  <div class="hint">Conversations are saved on the drive,<br>never on this computer.</div>
</aside>

<main>
  <div id="messages">
    <div class="empty">
      <h1>Local model, ready.</h1>
      <p>Everything below runs from the drive. Nothing leaves this computer.</p>
    </div>
  </div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Send a message…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send" type="submit">Send</button>
    <button id="stop" type="button" hidden>Stop</button>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
