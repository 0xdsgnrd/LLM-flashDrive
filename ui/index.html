<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket LLM</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Icons as one inline sprite: no icon font, no CDN, no extra requests, and
     usable from JS-built markup via <use> without duplicating any paths. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-mark" viewBox="0 0 24 24">
    <path style="fill:currentColor;stroke:none" d="M4.52,8.88l1.12.02V3.17c0-.27.11-.54.32-.76s.48-.32.76-.32h10.68s0,0,0,0c.23.02.46.13.64.31.23.23.33.53.32.83h0v5.64s1.12,0,1.12,0v6.53c0,1.92-.73,3.83-2.19,5.29-2.92,2.92-7.65,2.92-10.57,0-1.46-1.46-2.19-3.37-2.19-5.29v-6.53M17.35,15.42v-4.4H6.66v4.4c0,1.37.52,2.73,1.56,3.78,2.08,2.08,5.47,2.08,7.55,0,1.04-1.04,1.56-2.41,1.57-3.78M8.8,5.15l2.15-.02-.02,2.14h-2.12s0-2.12,0-2.12M13.06,5.14l2.15.02v2.13h-2.12s-.02-2.15-.02-2.15M16.22,4.24H7.78s.02,4.65.02,4.65h8.42s0-4.65,0-4.65Z"/>
    <line style="fill:none;stroke:currentColor;stroke-width:1.5" x1="12" y1="12.97" x2="12" y2="17.83"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24">
    <path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20Z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="9" y="9" width="11" height="11" rx="2.5"/>
    <path d="M15 5.5A2.5 2.5 0 0 0 12.5 3h-7A2.5 2.5 0 0 0 3 5.5v7A2.5 2.5 0 0 0 5.5 15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <path d="M20 11a8 8 0 1 0-.6 4"/><path d="M20 5v6h-6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24">
    <path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9l-6-6Z"/>
    <path d="M13 3v6h6"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24">
    <path d="M20 14.5A2.5 2.5 0 0 1 17.5 17H9l-4 3.5V6.5A2.5 2.5 0 0 1 7.5 4h10A2.5 2.5 0 0 1 20 6.5Z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24">
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/>
    <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5Z"/></symbol>
</defs></svg>

<aside id="sidebar">
  <div class="side-head">
    <div class="brand"><svg class="mark ic"><use href="#i-mark"/></svg><span>Pocket LLM</span></div>
    <div class="spacer"></div>
    <button id="toggle-side" class="icon-btn" title="Hide sidebar" aria-label="Hide sidebar">
      <svg class="ic"><use href="#i-panel"/></svg></button>
  </div>

  <nav class="nav">
    <button id="new-chat" class="nav-item">
      <svg class="ic"><use href="#i-pencil"/></svg>New chat</button>
    <button id="toggle-search" class="nav-item">
      <svg class="ic"><use href="#i-search"/></svg>Search</button>
  </nav>
  <div id="search-wrap" class="search-wrap" hidden>
    <input id="chat-search" type="search" placeholder="Search conversations…" autocomplete="off">
  </div>

  <div class="side-scroll">
    <section id="docs-section" hidden>
      <div class="side-label">
        <span id="docs-label">Documents</span>
        <button id="add-docs" title="Add documents" aria-label="Add documents">
          <svg class="ic"><use href="#i-plus"/></svg></button>
      </div>
      <div id="doc-list"></div>
      <label class="use-docs" title="Search your documents and give the model what it finds">
        <input type="checkbox" id="use-docs" disabled><span>Use in answers</span>
      </label>
      <div id="retrieval-mode" class="retrieval-mode" hidden></div>
    </section>

    <section>
      <div class="side-label"><span>Chats</span></div>
      <div id="chats"></div>
    </section>
  </div>

  <div class="side-foot">
    <div class="foot-row">
      <span id="status-dot" class="dot"></span>
      <span id="status">offline</span>
      <div class="spacer"></div>
      <span id="tps">—</span>
    </div>
    <button id="erase-all" class="erase" hidden>Erase all conversations</button>
  </div>
</aside>

<main id="main">
  <header class="topbar">
    <button id="show-side" class="icon-btn" hidden title="Show sidebar" aria-label="Show sidebar">
      <svg class="ic"><use href="#i-panel"/></svg></button>
    <div class="model-pick">
      <button id="model-btn" class="model-btn" aria-haspopup="menu" aria-expanded="false">
        <span id="model-name">loading…</span><svg class="ic"><use href="#i-chevron"/></svg></button>
      <div id="model-menu" class="model-menu" role="menu" hidden></div>
    </div>
    <button id="new-chat-top" class="icon-btn" title="New chat" aria-label="New chat">
      <svg class="ic"><use href="#i-plus"/></svg></button>
    <div class="spacer"></div>
    <div id="history-badge" class="badge" hidden>History off</div>
    <button id="theme-btn" class="icon-btn" title="Switch to dark" aria-label="Switch theme">
      <svg class="ic"><use href="#i-moon"/></svg></button>
  </header>

  <div id="messages"></div>
  <button id="to-bottom" class="to-bottom" hidden title="Jump to latest" aria-label="Jump to latest">
    <svg class="ic"><use href="#i-down"/></svg></button>

  <form id="composer" class="composer">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder="How can I help you today?"
                autocomplete="off" spellcheck="true"></textarea>
      <div class="composer-bar">
        <button type="button" id="attach" class="tool-btn" title="Add documents" aria-label="Add documents">
          <svg class="ic"><use href="#i-plus"/></svg></button>
        <button type="button" id="docs-chip" class="chip" disabled
                title="Ground answers in your documents">
          <svg class="ic"><use href="#i-book"/></svg>Documents</button>
        <div class="spacer"></div>
        <button type="button" id="stop" class="round-btn" hidden title="Stop" aria-label="Stop">
          <svg class="ic"><use href="#i-stop"/></svg></button>
        <button type="submit" id="send" class="round-btn" title="Send" aria-label="Send">
          <svg class="ic"><use href="#i-up"/></svg></button>
      </div>
    </div>
    <div class="hint">Runs entirely on this machine. Nothing leaves this computer.</div>
  </form>
</main>

<input type="file" id="doc-input" multiple hidden
       accept=".txt,.md,.markdown,.mdx,.text,.rst,.org,.log,.csv,.tsv,.json,.yaml,.yml,
               .pdf,.docx,.pptx,.xlsx,.rtf,.xml,.html,.htm,.xhtml,.css,
               .zip,.tar,.gz,.tgz">

<script src="app.js"></script>
</body>
</html>
