# drive.lock — pinned inputs for a reproducible drive.
#
# Every line here is a fact resolved from an upstream API, not a guess. Sizes
# alone do NOT identify a model: the four Llama-70B Q4_K_M repackages differ by
# a few hundred bytes, and DeepSeek-R1-Distill-Llama-70B Q4_K_M lands within
# 2,368 bytes of Llama-3.3-70B. sha256 is the only reliable identity.
#
#   add an entry     ./scripts/lock-add.sh <hf-repo> <filename>
#   check the drive  ./scripts/verify-drive.sh          (sizes; --sha for content)
#
# Fields are whitespace-separated; '#' starts a comment.

# ---------------------------------------------------------------- toolchain
# The commit the shipped binaries were actually built from, confirmed via
# `git -C .cache/llama.cpp rev-parse HEAD`. It carries tag b10657, so the
# existing `git clone --depth 1 --branch $LLAMA_REF` needs no restructuring
# (--branch takes tags but NOT raw SHAs — pin to the tag, not the commit).
llama_ref     b10657
llama_commit  58546250cfaa1dc4a33ae6171dbe4344a96206e8

