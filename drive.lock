# ---------------------------------------------------------------- binaries
# release  <tag>  <github-repo>
# binary   <path-on-drive>  <bytes>  <sha256>
#
# The repo is recorded rather than read from git's origin, because a fork's
# origin is the fork — which has no release — and provisioning would dead-end
# on the most natural thing an interested person does. Forking and then
# publishing your own re-pins this line to your repo, which is correct.
#
# Published by release-binaries.sh, fetched by provision.sh. The asset name in
# the GitHub release is this path with '/' swapped for '-', because release
# assets share one flat namespace and three files are called llama-server.
#
# Pinning these by hash is what lets verify-drive.sh check the Linux and
# Windows binaries at all: it has only ever been able to run --version against
# the host's own, and a binary you cannot execute you cannot interrogate.
